<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DWTS Fantasy — Log In</title>
  <script>
    (function() {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
  <style>
    label { margin-bottom: 0.2rem; }
    input { margin-bottom: 1rem; }
    button { width: 100%; }
  </style>
</head>
<body class="centered">
  <div class="card login">
    <div class="top" style="margin-bottom:0.3rem">
      <h1>DWTS Fantasy</h1>
      <button type="button" id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode"></button>
    </div>
    <p class="hint">New here? Just enter a name and password to create your account.</p>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" autofocus required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>
      <button type="submit">Log In / Sign Up</button>
    </form>
  </div>
  <script src="{{ url_for('static', filename='theme.js') }}" defer></script>
</body>
</html>
