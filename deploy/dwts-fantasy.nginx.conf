# Install on the orangepi:
#   sudo cp deploy/dwts-fantasy.nginx.conf /etc/nginx/sites-available/dwts-fantasy
#   sudo ln -s /etc/nginx/sites-available/dwts-fantasy /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Replace server_name below with the orangepi's LAN hostname or IP.

server {
    listen 80;
    server_name dwts.local;

    location / {
        proxy_pass http://127.0.0.1:9902;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
