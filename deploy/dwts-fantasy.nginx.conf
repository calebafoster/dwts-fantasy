# Install on the orangepi:
#   sudo cp deploy/dwts-fantasy.nginx.conf /etc/nginx/sites-available/dwts-fantasy
#   sudo ln -s /etc/nginx/sites-available/dwts-fantasy /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Replace server_name below with the real domain/subdomain (or LAN hostname/IP
# for a plain HTTP-only setup).
#
# For a public domain fronted by Let's Encrypt, run certbot against this file
# after the plain-HTTP block above is live and reloaded:
#   sudo certbot --nginx -d dwtsfantasy.example.com
# Certbot rewrites this file in place, adding the listen-443 ssl block below
# and turning this block into an HTTP->HTTPS redirect. The block below is
# already written in that post-certbot shape so a from-scratch install and a
# certbot-updated install match.
#
# IMPORTANT: proxy_pass must stay http:// even in the ssl block, since
# gunicorn only ever listens with plain HTTP on 127.0.0.1:9902 -- nginx alone
# terminates TLS. Using https:// there makes nginx try (and hang) attempting
# a TLS handshake against a plain-HTTP socket.

server {
    listen 80;
    listen [::]:80;
    server_name dwtsfantasy.example.com;

    location / {
        proxy_pass http://127.0.0.1:9902;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

